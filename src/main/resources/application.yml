server:
  port: 8080
  servlet:
    context-path: /api

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  # 默认激活 dev 环境，本地开发用
  profiles:
    active: dev

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

blog:
  auth:
    jwt-secret: myblog-secure-jwt-secret-key-2026-liuyang
    jwt-expire-seconds: 604800  # 7天有效（单位：秒）
