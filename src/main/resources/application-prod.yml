spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/my_blog?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    username: ${MYSQL_USERNAME:myblog}
    # 口令不入库，由环境变量 MYSQL_PASSWORD 提供

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl  # 生产关闭SQL日志

blog:
  api:
    # 生产环境绝不把异常原文回传客户端，避免泄露表结构与内部实现
    expose-error-detail: false
  upload:
    dir: /opt/myblog/uploads  # Linux服务器路径
